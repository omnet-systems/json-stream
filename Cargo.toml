[package]
name = "json-stream"
version = "0.2.0-alpha.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/omnet-systems/json-stream"
description = "Stream token-preserving JSON array elements for Linux GIS imports"

[dependencies]
serde = "=1.0.229"
serde_json = "=1.0.154"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
